# Where the Capsule's inner engine keeps images, layers and volumes.
#
# The path is the per-workspace volume Capsule mounts at
# /var/lib/capsule/inner rather than the shared home, so two projects never
# see each other's images or containers. fuse-overlayfs stacks layers from
# inside a container, where the kernel overlay driver cannot.

[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/capsule/inner/containers"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"

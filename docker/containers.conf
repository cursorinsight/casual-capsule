# Podman configuration for the Capsule's own container engine.
#
# A Capsule has no systemd, so cgroups are managed directly rather than
# through a session manager, and events go to a file instead of journald.
# pasta gives the inner containers outbound networking without a daemon.

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[network]
default_rootless_network_cmd = "pasta"
# Podman's default 10.88.0.0/16 is also where a host's podman, such as a
# rootful podman machine, puts the Capsule itself. The same subnet inside
# shadows the Capsule's own gateway and cuts the default network, which
# Docker-API containers such as BuildKit use, off from the outside. This one
# sits outside Podman's pools for new networks and Docker's defaults.
default_subnet = "10.87.0.0/16"
